name: Archimedes
version: '${version}'
main: dev.jlo.archimedes.ArchimedesPlugin
description: Build persistent display-and-collision ships
api-version: '26.2'
author: jlo
commands:
  ship:
    description: Build and manage ships
    usage: /ship assemble|inspect|disassemble|buoyancy|sink
    permission: archimedes.command
permissions:
  archimedes.command:
    description: Base ship command access
    default: true
  archimedes.assemble:
    description: Assemble ships
    default: true
  archimedes.inspect:
    description: Inspect ships
    default: true
  archimedes.disassemble:
    description: Disassemble ships
    default: true
  archimedes.buoyancy:
    description: Toggle ship buoyancy
    default: true
  archimedes.sink:
    description: Lower a ship
    default: true