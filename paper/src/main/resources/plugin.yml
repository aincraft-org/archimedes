name: Archimedes
version: '${version}'
main: dev.mintychochip.archimedes.ArchimedesPlugin
description: Build persistent display-and-collision ships
api-version: '26.2'
author: jlo
commands:
  arch:
    description: Archimedes ships
    usage: /arch assemble|inspect|disassemble|buoyancy|sink|sail
    aliases: [ship]
    permission: archimedes.command
permissions:
  archimedes.command:
    description: Base ship command access
    default: true
  archimedes.assemble:
    description: Assemble ships
    default: true
  archimedes.inspect:
    description: Inspect ships
    default: true
  archimedes.disassemble:
    description: Disassemble ships
    default: true
  archimedes.buoyancy:
    description: Toggle ship buoyancy
    default: true
  archimedes.sink:
    description: Lower a ship
    default: true
  archimedes.sail:
    description: Spawn a predetermined sail ship
    default: true