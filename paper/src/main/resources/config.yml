# Maximum blocks a single ship may contain.
maximum-blocks: 2048

# Maximum distance in blocks for looking at a target block.
target-distance: 8

# Materials that cannot be captured into a ship (registry names).
forbidden-materials:
  - "minecraft:water"
  - "minecraft:lava"
  - "minecraft:air"
  - "minecraft:cave_air"
  - "minecraft:void_air"
  - "minecraft:barrier"
  - "minecraft:structure_void"
  - "minecraft:command_block"
  - "minecraft:chain_command_block"
  - "minecraft:repeating_command_block"
  - "minecraft:structure_block"
  - "minecraft:jigsaw"
  - "minecraft:debug_stick"
  - "minecraft:light"
  - "minecraft:bedrock"
  - "minecraft:end_portal"
  - "minecraft:end_gateway"
  - "minecraft:nether_portal"
  - "minecraft:moving_piston"

# Worlds where assembly is disabled (world UUIDs).
disabled-worlds:

# Buoyancy master switch.
buoyancy-enabled: true

# Server ticks between physics integrations.
physics-ticks: 1

# Maximum vertical bob amplitude around equilibrium (blocks).
bob-amplitude: 0.5

# Maximum vertical rise from the build site (blocks).
max-rise: 16.0

# Downward acceleration in blocks/s². Must stay near 10 so airborne hulls fall
# instead of gliding under sail force (0.5 plus damping is only ~0.2 blocks/s).
gravity: 10.0
# Water and hull densities share a scale. Oak stays 0.6 of water so wood still
# floats. Values are ~10× the old 1.0-water table so a 25 m² sail cannot
# overpower the hull's weight (that table made a medium ship ~47 mass units).
water-density: 10.0
block-density: 0.5
buoyancy:
  material-densities:
    minecraft:oak_planks: 6.0
  default-material-density: 10.0
  player-mass: 80.0
  max-fall: 16.0
  mass-tolerance: 1.0e-6
  draft-tolerance: 1.0e-3