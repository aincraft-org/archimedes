name: Create Stable Release

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Immutable stable CalVer: YYYY.MM.DD.run"
        required: true
        type: string

permissions: {}

concurrency:
  group: archimedes-stable-${{ inputs.stable_version }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create stable release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate stable version and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Stable releases are immutable. Start a new workflow run instead of rerunning this one." >&2
            exit 1
          fi
          if [[ ! "${STABLE_VERSION}" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.[1-9][0-9]*$ ]]; then
            echo "Invalid stable version: ${STABLE_VERSION}" >&2
            exit 1
          fi
          tag="${STABLE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Build stable plugin JAR
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          ./gradlew --no-daemon -PbuildVersion="${STABLE_VERSION}" clean check
          ./gradlew --no-daemon -PbuildVersion="${STABLE_VERSION}" assemble

      - name: Verify and checksum stable asset
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          plugin="paper/build/libs/archimedes-${STABLE_VERSION}.jar"
          test -s "${plugin}"
          sha256sum "${plugin}" > "${plugin}.sha256"

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          plugin="paper/build/libs/archimedes-${STABLE_VERSION}.jar"
          notes="$(mktemp)"
          trap 'rm -f "${notes}"' EXIT
          cat > "${notes}" <<NOTES
          ## Archimedes ${STABLE_VERSION}

          Stable release built from commit \`${GITHUB_SHA}\`.

          SHA-256 checksum file is attached for the plugin JAR.
          NOTES
          sed -i 's/^[[:space:]]*//' "${notes}"
          gh release create "${STABLE_VERSION}" \
            "${plugin}" "${plugin}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Archimedes ${STABLE_VERSION}" \
            --notes-file "${notes}" \
            --latest
